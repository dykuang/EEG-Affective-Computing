<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Blueprint for BCI foundation systems</title>
  <desc id="desc">A layered architecture runs from governed EEG data and signal adapters through pretrained encoders and personalization to bounded applications, surrounded by continuous evaluation, privacy, consent, and user control.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker><style>.title{font:700 25px sans-serif;fill:#172033}.label{font:700 18px sans-serif;fill:#172033}.body{font:16px sans-serif;fill:#334155}.small{font:14px sans-serif;fill:#475569}.box{stroke-width:2;rx:12}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="690" fill="#f8fafc"/><text x="55" y="50" class="title">Blueprint for reusable, human-directed BCI foundation systems</text>
  <rect x="65" y="90" width="1070" height="520" rx="20" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="10 8"/><text x="88" y="118" class="small">continuous requirements: consent, privacy, provenance, fairness, calibration, safety, and user override</text>
  <rect x="150" y="145" width="900" height="78" class="box" fill="#e0f2fe" stroke="#0284c7"/><text x="600" y="177" text-anchor="middle" class="label">Governed data and interoperable signal adapters</text><text x="600" y="204" text-anchor="middle" class="body">metadata, montage geometry, quality flags, task events, consent scope, and provenance</text>
  <path d="M600 223 L600 267" class="arrow"/>
  <rect x="150" y="272" width="900" height="78" class="box" fill="#ede9fe" stroke="#7c3aed"/><text x="600" y="304" text-anchor="middle" class="label">Self-supervised neural backbones</text><text x="600" y="331" text-anchor="middle" class="body">temporal-spatial representations, uncertainty heads, cross-device and cross-task transfer</text>
  <path d="M600 350 L600 394" class="arrow"/>
  <rect x="150" y="399" width="900" height="78" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="600" y="431" text-anchor="middle" class="label">Reversible adaptation and personalization</text><text x="600" y="458" text-anchor="middle" class="body">adapters, calibration, drift monitoring, confirmed feedback, rollback</text>
  <path d="M600 477 L600 521" class="arrow"/>
  <rect x="150" y="526" width="900" height="78" class="box" fill="#fff7ed" stroke="#ea580c"/><text x="600" y="558" text-anchor="middle" class="label">Bounded applications and shared autonomy</text><text x="600" y="585" text-anchor="middle" class="body">assistive communication, adaptive interfaces, quality support, confirmed actions, and abstention</text>
  <rect x="70" y="260" width="62" height="245" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="101" y="286" text-anchor="middle" class="small" transform="rotate(-90 101 286)">evaluation and red teaming</text>
  <rect x="1068" y="260" width="62" height="245" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="1099" y="286" text-anchor="middle" class="small" transform="rotate(90 1099 286)">user control and governance</text>
  <text x="55" y="658" class="small">Scale is valuable only when it improves reusable transfer, safety, and user-defined outcomes across real devices and sessions.</text>
</svg>