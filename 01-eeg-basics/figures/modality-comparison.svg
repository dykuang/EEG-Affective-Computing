<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="600px" version="1.1" viewBox="0,0,700,600" width="700px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="10" refY="5"><polygon fill="#333" points="0,0 10,5 0,10" /></marker></defs><rect fill="#ffffff" height="600" width="700" x="0" y="0" /><text fill="#333" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="350.0" y="35">Brain measurement modality trade-offs</text><line stroke="#333" stroke-width="2" x1="80" x2="620" y1="500" y2="500" /><line stroke="#333" stroke-width="2" x1="80" x2="80" y1="500" y2="100" /><text fill="#333" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" x="350.0" y="535">Temporal resolution →</text><text fill="#333" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" transform="rotate(-90, 45, 300.0)" x="45" y="300.0">Spatial resolution →</text><line stroke="#333" stroke-width="1.5" x1="80.0" x2="80.0" y1="500" y2="506" /><text fill="#333" font-family="Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" x="80.0" y="518">Poor</text><line stroke="#333" stroke-width="1.5" x1="350.0" x2="350.0" y1="500" y2="506" /><text fill="#333" font-family="Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" x="350.0" y="518">Moderate</text><line stroke="#333" stroke-width="1.5" x1="620.0" x2="620.0" y1="500" y2="506" /><text fill="#333" font-family="Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" x="620.0" y="518">Excellent</text><line stroke="#333" stroke-width="1.5" x1="80" x2="74" y1="500.0" y2="500.0" /><text fill="#333" font-family="Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="end" x="68" y="504.0">Low</text><line stroke="#333" stroke-width="1.5" x1="80" x2="74" y1="300.0" y2="300.0" /><text fill="#333" font-family="Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="end" x="68" y="304.0">Moderate</text><line stroke="#333" stroke-width="1.5" x1="80" x2="74" y1="100.0" y2="100.0" /><text fill="#333" font-family="Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="end" x="68" y="104.0">High</text><circle cx="606.5" cy="340.0" fill="#3498db" opacity="0.75" r="18" stroke="#333" stroke-width="1.5" /><text fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="606.5" y="312.0">EEG</text><text fill="#555" font-family="Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" x="606.5" y="326.0">Cost: Low-moderate</text><circle cx="606.5" cy="200.0" fill="#9b59b6" opacity="0.75" r="28" stroke="#333" stroke-width="1.5" /><text fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="606.5" y="162.0">MEG</text><text fill="#555" font-family="Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" x="606.5" y="176.0">Cost: Very high</text><circle cx="134.0" cy="110.0" fill="#e74c3c" opacity="0.75" r="32" stroke="#333" stroke-width="1.5" /><text fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="134.0" y="160.0">fMRI</text><text fill="#555" font-family="Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" x="134.0" y="174.0">Cost: Very high</text><circle cx="593.0" cy="120.0" fill="#e67e22" opacity="0.75" r="14" stroke="#333" stroke-width="1.5" /><text fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="593.0" y="96.0">ECoG</text><text fill="#555" font-family="Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" x="593.0" y="110.0">Cost: Clinical only</text><circle cx="323.0" cy="300.0" fill="#2ecc71" opacity="0.75" r="20" stroke="#333" stroke-width="1.5" /><text fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="323.0" y="270.0">fNIRS</text><text fill="#555" font-family="Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" x="323.0" y="284.0">Cost: Moderate</text><text fill="#333" font-family="Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" x="520" y="70">Marker size ∝ typical cost</text><circle cx="530" cy="88" fill="#bbb" r="8" /><circle cx="530" cy="112" fill="#bbb" r="16" /><text fill="#333" font-family="Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" x="550" y="92">Lower</text><text fill="#333" font-family="Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" x="550" y="116">Higher</text><text fill="#3498db" font-family="Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" x="90" y="125">EEG: fast, accessible, spatially limited</text></svg>