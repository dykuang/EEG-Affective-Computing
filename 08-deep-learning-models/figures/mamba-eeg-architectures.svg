<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a4a4a"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f5d8a"/>
    </marker>
  </defs>

  <!-- Residual (dashed) connection: Input -> add node -->
  <path d="M 85 230 L 85 70 L 1075 70 L 1075 240" fill="none" stroke="#2f5d8a" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrowBlue)"/>
  <rect x="78" y="55" width="74" height="24" rx="5" fill="#ffffff" stroke="#2f5d8a" stroke-width="1"/>
  <text x="115" y="71" text-anchor="middle" font-size="15" fill="#2f5d8a">residual (x)</text>

  <!-- 1. Input -->
  <rect x="20" y="230" width="130" height="70" rx="8" fill="#f4f7fb" stroke="#3b6ea5" stroke-width="2"/>
  <text x="85" y="256" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f3d5c">Input</text>
  <text x="85" y="278" text-anchor="middle" font-size="14" fill="#3b5f84">EEG sequence</text>
  <text x="85" y="295" text-anchor="middle" font-size="12.5" fill="#6b7f99">(T, n_channels)</text>

  <!-- 2. Linear projection -->
  <rect x="180" y="239" width="120" height="52" rx="8" fill="#f4f7fb" stroke="#3b6ea5" stroke-width="2"/>
  <text x="240" y="261" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3d5c">Linear</text>
  <text x="240" y="280" text-anchor="middle" font-size="13" fill="#3b5f84">projection → (T, 2d)</text>

  <!-- 3. 1D Convolution -->
  <rect x="330" y="239" width="110" height="52" rx="8" fill="#f4f7fb" stroke="#3b6ea5" stroke-width="2"/>
  <text x="385" y="261" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3d5c">1D Conv</text>
  <text x="385" y="280" text-anchor="middle" font-size="13" fill="#3b5f84">(local mixing)</text>

  <!-- 4. SiLU -->
  <rect x="470" y="239" width="70" height="52" rx="8" fill="#f4f7fb" stroke="#3b6ea5" stroke-width="2"/>
  <text x="505" y="269" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3d5c">SiLU</text>

  <!-- 5. Selective SSM core -->
  <rect x="570" y="110" width="210" height="300" rx="10" fill="#eef4fb" stroke="#2f5d8a" stroke-width="2.5"/>
  <rect x="570" y="110" width="210" height="40" rx="10" fill="#2f5d8a"/>
  <rect x="570" y="130" width="210" height="20" fill="#2f5d8a"/>
  <text x="675" y="136" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Selective SSM</text>

  <g font-size="13.5" fill="#1f3d5c">
    <text x="675" y="178" text-anchor="middle">Δ = softplus(Linear(x) + b)</text>
    <text x="675" y="212" text-anchor="middle">B = Linear(x)</text>
    <text x="675" y="246" text-anchor="middle">C = Linear(x)</text>
    <text x="675" y="286" text-anchor="middle" font-weight="bold">Discretize A with Δ</text>
  </g>
  <rect x="592" y="308" width="166" height="78" rx="6" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.2"/>
  <text x="675" y="330" text-anchor="middle" font-size="13.5" fill="#1f3d5c">Parallel scan:</text>
  <text x="675" y="352" text-anchor="middle" font-size="13.5" fill="#1f3d5c">xₖ = Āₖxₖ₋₁ + B̄ₖuₖ</text>

  <!-- 6. SiLU gate -->
  <rect x="820" y="239" width="70" height="52" rx="8" fill="#f4f7fb" stroke="#3b6ea5" stroke-width="2"/>
  <text x="855" y="269" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3d5c">SiLU</text>

  <!-- 7. Linear projection (out) -->
  <rect x="920" y="239" width="120" height="52" rx="8" fill="#f4f7fb" stroke="#3b6ea5" stroke-width="2"/>
  <text x="980" y="261" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3d5c">Linear</text>
  <text x="980" y="280" text-anchor="middle" font-size="13" fill="#3b5f84">projection → (T, d)</text>

  <!-- Add node -->
  <circle cx="1075" cy="265" r="16" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/>
  <text x="1075" y="271" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f5d8a">+</text>

  <!-- 8. Output / readout -->
  <rect x="1110" y="230" width="110" height="70" rx="8" fill="#eef4fb" stroke="#2f5d8a" stroke-width="2"/>
  <text x="1165" y="256" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3d5c">Output</text>
  <text x="1165" y="278" text-anchor="middle" font-size="13" fill="#3b5f84">(T, d) → next block</text>

  <!-- Main flow arrows -->
  <path d="M 150 265 L 176 265" fill="none" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 300 265 L 326 265" fill="none" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 440 265 L 466 265" fill="none" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 540 265 L 566 265" fill="none" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 780 265 L 816 265" fill="none" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 890 265 L 916 265" fill="none" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1040 265 L 1055 265" fill="none" stroke="#4a4a4a" stroke-width="2"/>
  <path d="M 1091 265 L 1106 265" fill="none" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
