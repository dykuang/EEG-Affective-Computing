<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">EEG-specific knowledge-distillation signals</title>
  <desc id="desc">A high-density teacher passes output, feature, and relation signals through training-only projection modules to a compact low-density student.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker>
    <style>
      .title { font: 700 25px sans-serif; fill: #172033; }
      .label { font: 700 17px sans-serif; fill: #172033; }
      .body { font: 15px sans-serif; fill: #334155; }
      .small { font: 14px sans-serif; fill: #475569; }
      .panel { stroke-width: 2; rx: 12; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 6; }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="60" y="52" class="title">Distil the signal that matches the EEG deployment constraint</text>
  <rect x="55" y="91" width="290" height="435" class="panel" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="200" y="128" text-anchor="middle" class="label">Teacher: laboratory EEG</text>
  <text x="200" y="155" text-anchor="middle" class="small">high-density montage, longer context</text>
  <circle cx="200" cy="260" r="73" fill="#faf5ff" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="200" cy="213" r="7" fill="#7c3aed"/><circle cx="165" cy="236" r="7" fill="#7c3aed"/><circle cx="235" cy="236" r="7" fill="#7c3aed"/><circle cx="151" cy="278" r="7" fill="#7c3aed"/><circle cx="249" cy="278" r="7" fill="#7c3aed"/><circle cx="175" cy="304" r="7" fill="#7c3aed"/><circle cx="225" cy="304" r="7" fill="#7c3aed"/><circle cx="200" cy="263" r="7" fill="#7c3aed"/>
  <text x="200" y="370" text-anchor="middle" class="body">CNN / Transformer / GNN</text>
  <rect x="100" y="398" width="200" height="80" rx="8" fill="#ddd6fe"/>
  <text x="200" y="431" text-anchor="middle" class="body">outputs, features,</text>
  <text x="200" y="457" text-anchor="middle" class="body">relations</text>
  <rect x="455" y="105" width="290" height="405" class="panel" fill="#fff7ed" stroke="#ea580c"/>
  <text x="600" y="143" text-anchor="middle" class="label">Training-only transfer targets</text>
  <rect x="490" y="180" width="220" height="68" rx="8" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
  <text x="600" y="208" text-anchor="middle" class="body">Soft outputs</text><text x="600" y="231" text-anchor="middle" class="small">class structure / uncertainty</text>
  <rect x="490" y="278" width="220" height="68" rx="8" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
  <text x="600" y="306" text-anchor="middle" class="body">Projected features</text><text x="600" y="329" text-anchor="middle" class="small">spectral-temporal representation</text>
  <rect x="490" y="376" width="220" height="68" rx="8" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
  <text x="600" y="404" text-anchor="middle" class="body">Relations</text><text x="600" y="427" text-anchor="middle" class="small">patch, sample, or channel geometry</text>
  <path d="M345 430 L455 214" class="arrow"/><path d="M345 438 L455 312" class="arrow"/><path d="M345 447 L455 410" class="arrow"/>
  <rect x="855" y="91" width="290" height="435" class="panel" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1000" y="128" text-anchor="middle" class="label">Student: deployable EEG</text>
  <text x="1000" y="155" text-anchor="middle" class="small">wearable subset, causal short window</text>
  <circle cx="1000" cy="260" r="73" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <circle cx="1000" cy="213" r="8" fill="#16a34a"/><circle cx="963" cy="250" r="8" fill="#16a34a"/><circle cx="1037" cy="250" r="8" fill="#16a34a"/><circle cx="1000" cy="298" r="8" fill="#16a34a"/>
  <text x="1000" y="370" text-anchor="middle" class="body">compact CNN / TCN / small Transformer</text>
  <rect x="900" y="398" width="200" height="80" rx="8" fill="#bbf7d0"/>
  <text x="1000" y="431" text-anchor="middle" class="body">emotion prediction</text>
  <text x="1000" y="457" text-anchor="middle" class="body">at deployment</text>
  <path d="M745 214 L855 352" class="arrow"/><path d="M745 312 L855 404" class="arrow"/><path d="M745 410 L855 438" class="arrow"/>
  <line x1="785" y1="80" x2="785" y2="545" class="dash" stroke="#94a3b8" stroke-width="2"/>
  <text x="785" y="570" text-anchor="middle" class="small">teacher and transfer modules are discarded after training</text>
  <text x="60" y="595" class="small">A smaller student may use fewer channels or less context, but the unavailable information must be excluded before every preprocessing and evaluation step.</text>
</svg>