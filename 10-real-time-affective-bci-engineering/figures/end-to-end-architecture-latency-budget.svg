<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="fig101-title fig101-desc">
  <title id="fig101-title">End-to-end real-time affective BCI architecture and latency budget</title>
  <desc id="fig101-desc">Pipeline from EEG and auxiliary sensors through timestamped streaming, buffer, causal processing, inference, quality and uncertainty gate, decision policy, and interface, with feedback to the user and a logging layer under every stage.</desc>
  <defs>
    <linearGradient id="fig101-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#143B5D"/>
      <stop offset="1" stop-color="#246B78"/>
    </linearGradient>
    <marker id="fig101-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2E6473"/>
    </marker>
    <marker id="fig101-arrowBack" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#8A4B1F"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="#F4F7F9"/>
  <rect width="1600" height="118" fill="url(#fig101-header)"/>
  <text x="800" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">Real-Time Affective BCI: Timed Loop and Latency Budget</text>
  <text x="800" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#DDECF0">Sensors to action are staged delays. Feedback returns to the user. Logging observes every stage.</text>

  <rect x="36" y="250" width="150" height="210" rx="16" fill="#FFFFFF" stroke="#143B5D" stroke-width="2"/>
  <circle cx="111" cy="318" r="28" fill="#143B5D"/>
  <circle cx="111" cy="308" r="11" fill="#FFFFFF"/>
  <path d="M90 348 C90 332 132 332 132 348" fill="#FFFFFF"/>
  <text x="111" y="378" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#263746">User</text>
  <text x="111" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F6F7C">physiology</text>
  <text x="111" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F6F7C">and behavior</text>

  <rect x="214" y="228" width="168" height="118" rx="14" fill="#FFFFFF" stroke="#C5D0D6" stroke-width="1.5"/>
  <rect x="214" y="364" width="168" height="118" rx="14" fill="#FFFFFF" stroke="#C5D0D6" stroke-width="1.5"/>
  <text x="298" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#263746">EEG sensors</text>
  <text x="298" y="294" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F6F7C">amp + digitizer</text>
  <text x="298" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2E6473">L_acquisition</text>
  <text x="298" y="404" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#263746">Auxiliary</text>
  <text x="298" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F6F7C">EOG, motion, logs</text>
  <text x="298" y="454" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2E6473">own clocks</text>

  <path d="M186 320 H214" stroke="#2E6473" stroke-width="3" marker-end="url(#fig101-arrow)"/>
  <path d="M186 400 H214" stroke="#2E6473" stroke-width="3" marker-end="url(#fig101-arrow)"/>

  <rect x="412" y="268" width="150" height="176" rx="14" fill="#FFFFFF" stroke="#C5D0D6" stroke-width="1.5"/>
  <text x="487" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#263746">Timestamped</text>
  <text x="487" y="342" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#263746">stream</text>
  <text x="487" y="376" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F6F7C">transport</text>
  <text x="487" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F6F7C">device + arrival</text>
  <text x="487" y="424" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2E6473">clocks</text>
  <path d="M382 316 H412" stroke="#2E6473" stroke-width="3" marker-end="url(#fig101-arrow)"/>
  <path d="M382 400 H412" stroke="#2E6473" stroke-width="3" marker-end="url(#fig101-arrow)"/>

  <rect x="592" y="268" width="140" height="176" rx="14" fill="#FFFFFF" stroke="#C5D0D6" stroke-width="1.5"/>
  <text x="662" y="328" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#263746">Ring buffer</text>
  <text x="662" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F6F7C">gaps / order</text>
  <text x="662" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2E6473">L_buffer</text>
  <path d="M562 356 H592" stroke="#2E6473" stroke-width="3" marker-end="url(#fig101-arrow)"/>

  <rect x="762" y="268" width="150" height="176" rx="14" fill="#FFFFFF" stroke="#C5D0D6" stroke-width="1.5"/>
  <text x="837" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#263746">Causal</text>
  <text x="837" y="342" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#263746">processing</text>
  <text x="837" y="376" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F6F7C">window + filters</text>
  <text x="837" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2E6473">L_preprocessing</text>
  <path d="M732 356 H762" stroke="#2E6473" stroke-width="3" marker-end="url(#fig101-arrow)"/>

  <rect x="942" y="268" width="130" height="176" rx="14" fill="#FFFFFF" stroke="#C5D0D6" stroke-width="1.5"/>
  <text x="1007" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#263746">Inference</text>
  <text x="1007" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F6F7C">batch size 1</text>
  <text x="1007" y="404" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2E6473">L_inference</text>
  <path d="M912 356 H942" stroke="#2E6473" stroke-width="3" marker-end="url(#fig101-arrow)"/>

  <rect x="1102" y="268" width="150" height="176" rx="14" fill="#FFF8F0" stroke="#8A4B1F" stroke-width="2"/>
  <text x="1177" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#263746">Quality and</text>
  <text x="1177" y="342" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#263746">uncertainty gate</text>
  <text x="1177" y="378" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F6F7C">act / abstain</text>
  <text x="1177" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8A4B1F">not a softmax</text>
  <path d="M1072 356 H1102" stroke="#2E6473" stroke-width="3" marker-end="url(#fig101-arrow)"/>

  <rect x="1282" y="228" width="282" height="118" rx="14" fill="#FFFFFF" stroke="#C5D0D6" stroke-width="1.5"/>
  <rect x="1282" y="364" width="282" height="118" rx="14" fill="#E8F4EF" stroke="#2C9A78" stroke-width="2"/>
  <text x="1423" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#263746">Decision policy</text>
  <text x="1423" y="298" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F6F7C">hysteresis, dwell, override</text>
  <text x="1423" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2E6473">L_policy</text>
  <text x="1423" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#263746">Interface / intervention</text>
  <text x="1423" y="434" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F6F7C">display, audio, app action</text>
  <text x="1423" y="458" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2C9A78">L_output</text>
  <path d="M1252 330 H1282" stroke="#2E6473" stroke-width="3" marker-end="url(#fig101-arrow)"/>
  <path d="M1423 346 V364" stroke="#2E6473" stroke-width="3" marker-end="url(#fig101-arrow)"/>

  <path d="M1282 482 C900 560 420 560 186 430" fill="none" stroke="#8A4B1F" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#fig101-arrowBack)"/>
  <text x="720" y="548" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8A4B1F">Feedback changes the next observation</text>

  <rect x="36" y="600" width="1528" height="132" rx="16" fill="#FFFFFF" stroke="#C5D0D6" stroke-width="1.5"/>
  <rect x="36" y="600" width="18" height="132" rx="8" fill="#143B5D"/>
  <text x="80" y="642" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#263746">Logging and monitoring (beside the loop, not after it)</text>
  <text x="80" y="676" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5F6F7C">timestamps | quality | uncertainty | mode | prediction | action or abstention | versions | override</text>
  <text x="80" y="706" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5F6F7C">Sufficient lineage to replay each decision from the recorded stream and configuration.</text>

  <rect x="36" y="760" width="1528" height="180" rx="16" fill="#143B5D"/>
  <text x="800" y="808" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">L_total = L_acquisition + L_buffer + L_preprocessing + L_inference + L_policy + L_output</text>
  <text x="800" y="848" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#DDECF0">Algorithmic delay, computational latency, and feedback latency are different quantities.</text>
  <text x="800" y="882" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#DDECF0">Report the distribution (median, upper quantiles, worst credible case), not only the mean.</text>
  <text x="800" y="914" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#DDECF0">Acceptable delay depends on mood estimation, arousal tracking, workload detection, or neurofeedback.</text>
</svg>
