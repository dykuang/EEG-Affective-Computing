  <g fill="#D5E6E0" stroke="#4F8171" stroke-width="2">
    <rect x="340" y="515" width="120" height="60" rx="9"/><rect x="475" y="515" width="120" height="60" rx="9"/><rect x="610" y="515" width="120" height="60" rx="9"/><rect x="745" y="515" width="120" height="60" rx="9"/><rect x="880" y="515" width="120" height="60" rx="9"/><rect x="1015" y="515" width="120" height="60" rx="9"/><rect x="1150" y="515" width="120" height="60" rx="9"/><rect x="1285" y="515" width="120" height="60" rx="9"/>
  </g>
