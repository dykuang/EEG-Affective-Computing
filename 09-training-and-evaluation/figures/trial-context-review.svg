<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Reviewing local affect predictions in full trial context</title>
  <desc id="desc">Aligned tracks show stimulus events, EEG signal quality, artifact flags, window boundaries, predictions with uncertainty, and delayed trial-level labels.</desc>
  <defs><linearGradient id="p2" y2="1"><stop stop-color="#FCF9F0"/><stop offset="1" stop-color="#F1EADB"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#p2)"/>
  <text x="800" y="63" text-anchor="middle" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#29483F">See Every Window in Its Living Context</text>
  <text x="800" y="100" text-anchor="middle" font-family="Arial" font-size="19" fill="#69776F">Aligned evidence reveals whether a local prediction is credible</text>
  <rect x="90" y="145" width="1420" height="665" rx="28" fill="#FFFDF8"/>
  <g font-family="Arial" font-size="18" font-weight="700" fill="#40564E"><text x="125" y="210">Stimulus &amp; events</text><text x="125" y="325">Signal quality</text><text x="125" y="435">Artifact flags</text><text x="125" y="545">EEG windows</text><text x="125" y="655">Prediction</text><text x="125" y="760">Labels</text></g>
  <path d="M330 205H1450" stroke="#75847C" stroke-width="3"/>
  <rect x="390" y="174" width="730" height="58" rx="14" fill="#DDE8D5"/><text x="755" y="210" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#3F6037">emotion-inducing trial</text>
  <path d="M760 155V790" stroke="#B68A36" stroke-width="3" stroke-dasharray="8 8"/><rect x="672" y="136" width="176" height="35" rx="17" fill="#F1DDAA"/><text x="760" y="159" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#76591C">meaningful event</text>
  <path d="M330 345C390 330 435 285 500 305C565 325 610 300 680 312C745 323 790 362 850 350C915 337 965 285 1030 304C1100 324 1148 338 1215 315C1280 294 1365 308 1450 323" fill="none" stroke="#497B6C" stroke-width="7" stroke-linecap="round"/>
