<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Robust learning pipeline for noisy affect labels</title>
  <desc id="desc">Raw EEG windows and imperfect labels flow through quality-aware weighting, soft targets, consistency learning, and uncertainty-aware prediction.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#FBF8EF"/><stop offset="1" stop-color="#F3EEDF"/></linearGradient>
    <linearGradient id="river" x2="1"><stop stop-color="#497B6C"/><stop offset="1" stop-color="#79A58C"/></linearGradient>
    <filter id="soft"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#53685B" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527567"/></marker>
  </defs>
  <rect width="1600" height="820" fill="url(#paper)"/>
  <path d="M0 110C260 75 410 142 670 110S1110 66 1600 116V0H0Z" fill="#315C50"/>
  <text x="800" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#FFFDF6">Growing Reliable Affect Models from Imperfect Supervision</text>
  <text x="800" y="95" text-anchor="middle" font-family="Arial" font-size="19" fill="#E5EFE8">A robust EEG training ecosystem</text>
  <g filter="url(#soft)">
    <path d="M70 270Q70 220 120 220H350Q400 220 400 270V555Q400 605 350 605H120Q70 605 70 555Z" fill="#FFFDF8"/>
    <path d="M1200 270Q1200 220 1250 220H1480Q1530 220 1530 270V555Q1530 605 1480 605H1250Q1200 605 1200 555Z" fill="#FFFDF8"/>
  </g>
  <g font-family="Georgia,serif" text-anchor="middle" fill="#29483F">
    <text x="235" y="265" font-size="27" font-weight="700">Imperfect evidence</text>
    <text x="1365" y="265" font-size="27" font-weight="700">Honest prediction</text>
  </g>
  <path d="M112 365q17-55 34 0t34 0t34 0t34 0t34 0t34 0t34 0" fill="none" stroke="#497B6C" stroke-width="6"/>
  <g font-family="Arial" text-anchor="middle"><text x="235" y="420" font-size="20" font-weight="700" fill="#35584D">raw EEG windows</text><text x="235" y="450" font-size="17" fill="#69776F">weak signal + artifacts</text></g>
  <g transform="translate(118 485) rotate(-5)"><rect width="108" height="58" rx="10" fill="#E8C9B7"/><text x="54" y="36" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#754A3C">observed</text></g>
  <g transform="translate(236 480) rotate(6)"><rect width="116" height="58" rx="10" fill="#EBCF88"/><text x="58" y="36" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#715A20">noisy label</text></g>
  <path d="M405 412C470 365 506 365 565 410" fill="none" stroke="#527567" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1035 410C1092 365 1135 365 1195 412" fill="none" stroke="#527567" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M510 410C595 252 820 170 1010 322C1068 369 1062 475 985 526C865 605 654 568 574 482C549 455 530 432 510 410Z" fill="url(#river)" opacity=".17"/>
  <g font-family="Georgia,serif" text-anchor="middle"><text x="800" y="220" font-size="29" font-weight="700" fill="#29483F">Robust training canopy</text></g>
  <g font-family="Arial" text-anchor="middle">
    <g><ellipse cx="625" cy="328" rx="125" ry="58" fill="#DDE8D5" stroke="#6E8D61" stroke-width="2"/><text x="625" y="321" font-size="19" font-weight="700" fill="#3F6037">sample</text><text x="625" y="347" font-size="19" font-weight="700" fill="#3F6037">reweighting</text></g>
    <g><ellipse cx="800" cy="300" rx="115" ry="55" fill="#F1DDAA" stroke="#B68A36" stroke-width="2"/><text x="800" y="294" font-size="19" font-weight="700" fill="#76591C">soft</text><text x="800" y="320" font-size="19" font-weight="700" fill="#76591C">targets</text></g>
    <g><ellipse cx="975" cy="328" rx="125" ry="58" fill="#D5E6E0" stroke="#4F8171" stroke-width="2"/><text x="975" y="321" font-size="19" font-weight="700" fill="#315C50">consistency</text><text x="975" y="347" font-size="19" font-weight="700" fill="#315C50">regularization</text></g>
    <g><ellipse cx="710" cy="455" rx="130" ry="58" fill="#E7D2C5" stroke="#A76E55" stroke-width="2"/><text x="710" y="449" font-size="19" font-weight="700" fill="#754A3C">robust loss</text><text x="710" y="475" font-size="17" fill="#754A3C">limits memorization</text></g>
    <g><ellipse cx="895" cy="455" rx="140" ry="58" fill="#DDD9E9" stroke="#776B94" stroke-width="2"/><text x="895" y="449" font-size="19" font-weight="700" fill="#554B71">teacher–student</text><text x="895" y="475" font-size="17" fill="#554B71">stable guidance</text></g>
  </g>
  <path d="M800 355V397" stroke="#527567" stroke-width="3"/>
  <g font-family="Arial" text-anchor="middle">
    <path d="M1285 360C1320 310 1390 310 1425 360C1460 410 1435 475 1365 505C1295 475 1250 410 1285 360Z" fill="#DDE8D5" stroke="#6E8D61" stroke-width="3"/>
    <text x="1365" y="382" font-size="21" font-weight="700" fill="#3F6037">affect</text><text x="1365" y="412" font-size="18" fill="#4F6850">distribution</text>
    <path d="M1288 535Q1365 575 1442 535" fill="none" stroke="#B68A36" stroke-width="5"/><text x="1365" y="570" font-size="18" font-weight="700" fill="#76591C">calibrated uncertainty</text>
  </g>
  <path d="M490 650C750 595 1000 700 1250 640" fill="none" stroke="#A7BDAA" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Arial" text-anchor="middle">
    <text x="800" y="695" font-size="20" font-weight="700" fill="#315C50">learn stable affective structure without pretending every label is certain</text>
    <text x="800" y="730" font-size="17" fill="#69776F">data quality • annotation quality • temporal structure • uncertainty</text>
  </g>
</svg>
