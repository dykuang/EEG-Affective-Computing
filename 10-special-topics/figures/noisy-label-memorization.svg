<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="title desc">
  <title id="title">Learning clean structure before memorizing noisy labels</title>
  <desc id="desc">Over training epochs, clean-pattern fit improves early while memorization of noisy examples rises later; a robust early-stopping region lies between them.</desc>
  <defs><linearGradient id="p3" y2="1"><stop stop-color="#FCF9F0"/><stop offset="1" stop-color="#F1EADB"/></linearGradient></defs>
  <rect width="1500" height="780" fill="url(#p3)"/>
  <text x="750" y="62" text-anchor="middle" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#29483F">Learning First, Memorizing Later</text>
  <text x="750" y="98" text-anchor="middle" font-family="Arial" font-size="19" fill="#69776F">Flexible networks often capture stable structure before fitting annotation mistakes</text>
  <path d="M120 650H1380M120 160V650" fill="none" stroke="#687870" stroke-width="3"/>
  <g stroke="#D8D5C8" stroke-width="1"><path d="M120 550H1380M120 450H1380M120 350H1380M120 250H1380"/></g>
  <g font-family="Arial" font-size="17" fill="#69776F"><text x="750" y="700" text-anchor="middle">Training epochs →</text><text x="38" y="410" transform="rotate(-90 38 410)" text-anchor="middle">Degree learned</text><text x="90" y="655">low</text><text x="84" y="170">high</text></g>
  <path d="M120 615C245 575 320 450 420 340C535 213 675 188 850 182C1030 176 1200 178 1380 178" fill="none" stroke="#497B6C" stroke-width="10" stroke-linecap="round"/>
  <path d="M120 635C385 630 540 620 665 580C790 540 845 445 930 360C1030 260 1175 205 1380 188" fill="none" stroke="#B86C50" stroke-width="10" stroke-linecap="round"/>
  <path d="M650 160C705 130 775 130 830 160V650H650Z" fill="#EBCF88" opacity=".23"/>
  <path d="M650 160V650M830 160V650" stroke="#B68A36" stroke-width="3" stroke-dasharray="9 7"/>
  <g font-family="Arial">
    <rect x="232" y="220" width="245" height="55" rx="28" fill="#DDE8D5"/><text x="354" y="254" text-anchor="middle" font-size="20" font-weight="700" fill="#3F6037">stable clean structure</text>
    <rect x="1035" y="410" width="270" height="55" rx="28" fill="#E7D2C5"/><text x="1170" y="444" text-anchor="middle" font-size="20" font-weight="700" fill="#754A3C">noisy-label memorization</text>
    <path d="M355 275C400 295 430 310 460 334" fill="none" stroke="#6E8D61" stroke-width="3"/>
    <path d="M1170 410C1125 380 1080 345 1030 300" fill="none" stroke="#A76E55" stroke-width="3"/>
    <text x="740" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#76591C">robust learning window</text>
    <text x="740" y="234" text-anchor="middle" font-size="16" fill="#806B39">reweight • select • regularize</text>
  </g>
  <path d="M120 732C350 712 520 735 750 718C960 703 1150 730 1380 710" fill="none" stroke="#A7BDAA" stroke-width="5" stroke-linecap="round"/>
</svg>
