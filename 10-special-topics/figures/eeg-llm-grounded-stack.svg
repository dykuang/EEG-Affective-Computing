<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Grounded EEG and language-model application stack</title>
  <desc id="desc">EEG and metadata enter an encoder, which emits bounded estimates and uncertainty. A consented context layer and restricted language-model tools lead to confirmation-gated actions.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker><style>.title{font:700 25px sans-serif;fill:#172033}.label{font:700 18px sans-serif;fill:#172033}.body{font:16px sans-serif;fill:#334155}.small{font:14px sans-serif;fill:#475569}.box{stroke-width:2;rx:12}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="610" fill="#f8fafc"/><text x="55" y="52" class="title">Grounded EEG-LLM application stack</text>
  <rect x="55" y="180" width="180" height="150" class="box" fill="#e0f2fe" stroke="#0284c7"/><text x="145" y="221" text-anchor="middle" class="label">EEG input</text><text x="145" y="252" text-anchor="middle" class="body">signal, montage,</text><text x="145" y="277" text-anchor="middle" class="body">quality, timing</text>
  <rect x="295" y="160" width="205" height="190" class="box" fill="#ede9fe" stroke="#7c3aed"/><text x="397" y="202" text-anchor="middle" class="label">EEG encoder</text><text x="397" y="234" text-anchor="middle" class="body">pretrained backbone</text><text x="397" y="260" text-anchor="middle" class="body">and task adapter</text><text x="397" y="306" text-anchor="middle" class="small">quality-aware, calibrated</text>
  <rect x="560" y="120" width="230" height="270" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="675" y="160" text-anchor="middle" class="label">Bounded evidence</text><text x="675" y="203" text-anchor="middle" class="body">workload: elevated</text><text x="675" y="232" text-anchor="middle" class="body">confidence: 0.61</text><line x1="590" y1="257" x2="760" y2="257" stroke="#86efac" stroke-width="2"/><text x="675" y="294" text-anchor="middle" class="body">OOD flag, provenance,</text><text x="675" y="320" text-anchor="middle" class="body">abstention option</text><text x="675" y="360" text-anchor="middle" class="small">not raw EEG as text</text>
  <rect x="850" y="105" width="285" height="300" class="box" fill="#fff7ed" stroke="#ea580c"/><text x="992" y="147" text-anchor="middle" class="label">Context and LLM layer</text><text x="992" y="188" text-anchor="middle" class="body">consented task context</text><text x="992" y="216" text-anchor="middle" class="body">retrieved preferences</text><text x="992" y="244" text-anchor="middle" class="body">typed explanations and tools</text><rect x="895" y="282" width="195" height="70" rx="8" fill="#ffedd5"/><text x="992" y="311" text-anchor="middle" class="body">propose, do not decide</text><text x="992" y="335" text-anchor="middle" class="small">restricted action schema</text>
  <path d="M235 255 L295 255" class="arrow"/><path d="M500 255 L560 255" class="arrow"/><path d="M790 255 L850 255" class="arrow"/>
  <path d="M992 405 L992 475" class="arrow"/><rect x="850" y="480" width="285" height="78" class="box" fill="#fef3c7" stroke="#d97706"/><text x="992" y="512" text-anchor="middle" class="label">Confirmation and safety policy</text><text x="992" y="540" text-anchor="middle" class="body">execute bounded action or abstain</text>
  <text x="55" y="582" class="small">Each boundary is inspectable: signal evidence, retrieved context, language output, and action authority are evaluated separately.</text>
</svg>