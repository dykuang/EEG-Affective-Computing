<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Multi-label and multi-task learning for EEG</title>
  <desc id="desc">A quality-controlled EEG recording enters a shared encoder. A multi-label head predicts co-occurring descriptors while task-specific heads estimate affect dimensions, workload, signal quality, and trial summaries. Missing labels mask their losses.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker><style>.title{font:700 25px sans-serif;fill:#172033}.label{font:700 17px sans-serif;fill:#172033}.body{font:15px sans-serif;fill:#334155}.small{font:13px sans-serif;fill:#475569}.box{stroke-width:2;rx:12}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="660" fill="#f8fafc"/><text x="52" y="52" class="title">Shared EEG representation, distinct supervision contracts</text>
  <rect x="55" y="238" width="190" height="150" class="box" fill="#e0f2fe" stroke="#0284c7"/><text x="150" y="275" text-anchor="middle" class="label">EEG recording</text><path d="M78 319 C95 278 111 356 130 312 S170 276 220 325" fill="none" stroke="#0369a1" stroke-width="4"/><text x="150" y="361" text-anchor="middle" class="small">channels, timing, quality flags</text>
  <path d="M245 313 L330 313" class="arrow"/><rect x="335" y="205" width="245" height="215" class="box" fill="#ede9fe" stroke="#7c3aed"/><text x="458" y="246" text-anchor="middle" class="label">Shared EEG encoder</text><text x="458" y="277" text-anchor="middle" class="body">temporal-spatial features</text><rect x="378" y="310" width="160" height="68" rx="8" fill="#ddd6fe"/><text x="458" y="340" text-anchor="middle" class="body">h_theta(x)</text><text x="458" y="363" text-anchor="middle" class="small">metadata and masks retained</text>
  <path d="M580 267 L660 157" class="arrow"/><path d="M580 313 L660 313" class="arrow"/><path d="M580 358 L660 472" class="arrow"/>
  <rect x="665" y="90" width="445" height="135" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="887" y="128" text-anchor="middle" class="label">Multi-label head: co-occurring labels</text><rect x="700" y="151" width="88" height="38" rx="6" fill="#bbf7d0"/><text x="744" y="176" text-anchor="middle" class="body">calm 0.72</text><rect x="812" y="151" width="108" height="38" rx="6" fill="#bbf7d0"/><text x="866" y="176" text-anchor="middle" class="body">engaged 0.81</text><rect x="944" y="151" width="125" height="38" rx="6" fill="#bbf7d0"/><text x="1006" y="176" text-anchor="middle" class="body">frustrated ?</text><text x="887" y="211" text-anchor="middle" class="small">sigmoid outputs; observed labels contribute loss</text>
  <rect x="665" y="255" width="445" height="118" class="box" fill="#fff7ed" stroke="#ea580c"/><text x="887" y="293" text-anchor="middle" class="label">Task-specific heads</text><text x="887" y="324" text-anchor="middle" class="body">valence-arousal regression | workload | artifact / quality</text><text x="887" y="350" text-anchor="middle" class="small">task-specific loss, scale, time support, and uncertainty</text>
  <rect x="665" y="408" width="445" height="128" class="box" fill="#fef3c7" stroke="#d97706"/><text x="887" y="446" text-anchor="middle" class="label">Trial-level aggregation head</text><text x="887" y="477" text-anchor="middle" class="body">attention or pooling over local windows</text><text x="887" y="504" text-anchor="middle" class="small">global self-report is not copied to every local segment</text>
  <path d="M880 225 L880 255" class="arrow"/><path d="M880 373 L880 408" class="arrow"/>
  <rect x="55" y="560" width="1055" height="55" rx="10" fill="#e2e8f0"/><text x="582" y="594" text-anchor="middle" class="body">For every head, declare: unit of analysis, annotation source, time scale, missing-label policy, split, metric, and deployment role.</text>
</svg>