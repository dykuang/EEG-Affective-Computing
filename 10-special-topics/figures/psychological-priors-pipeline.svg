<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">EEG affect-learning pipeline with psychological priors</title>
  <desc id="desc">EEG windows pass through a local encoder, latent dynamics, and subject calibration to predictions, while psychological priors constrain temporal inference and training.</desc>
  <defs>
    <linearGradient id="h6" x2="1"><stop stop-color="#143B5D"/><stop offset="1" stop-color="#246B78"/></linearGradient>
    <marker id="arr6" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2E6473"/></marker>
    <filter id="s6"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324D" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1600" height="760" fill="#F4F7F9"/><rect width="1600" height="106" fill="url(#h6)"/>
  <text x="800" y="52" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="white">Psychologically Structured EEG Affective Learning</text>
  <text x="800" y="84" text-anchor="middle" font-family="Arial" font-size="18" fill="#DDECF0">Local neural evidence + temporal dynamics + personal calibration</text>
  <g filter="url(#s6)">
    <rect x="70" y="315" width="245" height="155" rx="20" fill="white"/><rect x="390" y="315" width="245" height="155" rx="20" fill="white"/><rect x="710" y="315" width="245" height="155" rx="20" fill="white"/><rect x="1030" y="315" width="245" height="155" rx="20" fill="white"/><rect x="1350" y="315" width="180" height="155" rx="20" fill="white"/>
  </g>
