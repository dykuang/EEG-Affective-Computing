  <text x="760" y="181" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#2E6473">Psychological priors</text>
  <g font-family="Arial" font-size="17" font-weight="700" text-anchor="middle">
    <rect x="440" y="202" width="125" height="35" rx="17" fill="#E4F4EE"/><text x="502" y="225" fill="#26785E">inertia</text>
    <rect x="580" y="202" width="145" height="35" rx="17" fill="#E8F0F9"/><text x="652" y="225" fill="#356A9E">continuity</text>
    <rect x="740" y="202" width="180" height="35" rx="17" fill="#FBF1DF"/><text x="830" y="225" fill="#9A6A21">bounded change</text>
    <rect x="935" y="202" width="145" height="35" rx="17" fill="#FBEAEA"/><text x="1007" y="225" fill="#A43B3B">change points</text>
