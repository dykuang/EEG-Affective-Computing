  <g font-family="Arial" text-anchor="middle">
    <text x="192" y="360" font-size="24" font-weight="700" fill="#263746">EEG windows</text><text x="192" y="391" font-size="17" fill="#6B7985">preprocessed segments</text>
    <path d="M105 430q18-45 36 0t36 0t36 0t36 0t36 0" fill="none" stroke="#3D79B8" stroke-width="4"/>
    <text x="512" y="360" font-size="24" font-weight="700" fill="#263746">Local encoder</text><text x="512" y="391" font-size="17" fill="#6B7985">spatial–spectral features</text><rect x="447" y="417" width="130" height="14" rx="7" fill="#3D79B8" opacity=".65"/>
    <text x="832" y="360" font-size="24" font-weight="700" fill="#263746">Latent dynamics</text><text x="832" y="391" font-size="17" fill="#6B7985">structured temporal state</text><path d="M755 440C790 420 818 455 850 432C885 407 910 432 930 420" fill="none" stroke="#2C9A78" stroke-width="5"/>
    <text x="1152" y="360" font-size="24" font-weight="700" fill="#263746">Subject calibration</text><text x="1152" y="391" font-size="17" fill="#6B7985">personal baseline + offset</text><circle cx="1112" cy="431" r="15" fill="#E2A647"/><circle cx="1152" cy="431" r="15" fill="#2C9A78"/><circle cx="1192" cy="431" r="15" fill="#3D79B8"/>
    <text x="1440" y="360" font-size="24" font-weight="700" fill="#263746">Affect</text><text x="1440" y="391" font-size="17" fill="#6B7985">V–A trajectory</text><path d="M1388 443C1410 420 1430 430 1446 410C1464 388 1486 420 1505 401" fill="none" stroke="#D95757" stroke-width="5"/>
  </g>
