<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840" role="img" aria-labelledby="title desc">
  <title id="title">EEG-specific signals for estimating label trust</title>
  <desc id="desc">Temporal continuity, stimulus alignment, cross-modal agreement, subject baseline, and artifact indicators contribute to a sample trust score.</desc>
  <defs><linearGradient id="p5" y2="1"><stop stop-color="#FCF9F0"/><stop offset="1" stop-color="#F0E9D8"/></linearGradient><marker id="a5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#65785F"/></marker></defs>
  <rect width="1500" height="840" fill="url(#p5)"/>
  <text x="750" y="62" text-anchor="middle" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#29483F">Cultivating a Label-Trust Estimate</text>
  <text x="750" y="99" text-anchor="middle" font-family="Arial" font-size="19" fill="#69776F">EEG-specific context reveals whether an annotation deserves full influence</text>
  <g fill="none" stroke="#65785F" stroke-width="5" marker-end="url(#a5)">
    <path d="M365 230C505 260 585 335 655 405"/><path d="M1135 230C995 260 915 335 845 405"/>
    <path d="M290 540C460 530 565 500 650 465"/><path d="M1210 540C1040 530 935 500 850 465"/><path d="M750 690V575"/>
  </g>
  <g font-family="Arial" text-anchor="middle">
    <g><path d="M145 160C240 120 360 145 420 230C352 300 225 314 132 247C100 210 108 178 145 160Z" fill="#DDE8D5"/><text x="275" y="204" font-size="21" font-weight="700" fill="#3F6037">Temporal continuity</text><text x="275" y="234" font-size="16" fill="#546B50">plausible adjacent states?</text></g>
    <g><path d="M1075 160C1170 120 1290 145 1350 230C1282 300 1155 314 1062 247C1030 210 1038 178 1075 160Z" fill="#F1DDAA"/><text x="1205" y="204" font-size="21" font-weight="700" fill="#76591C">Stimulus alignment</text><text x="1205" y="234" font-size="16" fill="#806B39">timing supports the label?</text></g>
    <g><path d="M90 470C185 430 305 455 365 540C297 610 170 624 77 557C45 520 53 488 90 470Z" fill="#D5E6E0"/><text x="220" y="514" font-size="21" font-weight="700" fill="#315C50">Cross-modal agreement</text><text x="220" y="544" font-size="16" fill="#527067">physiology • behavior • context</text></g>
    <g><path d="M1135 470C1230 430 1350 455 1410 540C1342 610 1215 624 1122 557C1090 520 1098 488 1135 470Z" fill="#E7D2C5"/><text x="1265" y="514" font-size="21" font-weight="700" fill="#754A3C">Artifact indicators</text><text x="1265" y="544" font-size="16" fill="#805E50">blink • muscle • electrode pop</text></g>
    <g><path d="M610 660C700 620 810 630 882 705C830 790 710 814 620 755C585 724 580 685 610 660Z" fill="#DDD9E9"/><text x="748" y="708" font-size="21" font-weight="700" fill="#554B71">Subject baseline</text><text x="748" y="738" font-size="16" fill="#6B6381">personal normalization</text></g>
  </g>
