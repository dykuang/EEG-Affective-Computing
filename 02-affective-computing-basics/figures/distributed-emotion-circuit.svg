<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc">
  <title id="title">Distributed emotion circuit and complementary measurements</title>
  <desc id="desc">A salient event engages sensory, salience, valuation, control, and bodily regulation systems through reciprocal interactions. EEG samples cortical dynamics while peripheral measures capture bodily response.</desc>
  <defs>
    <linearGradient id="header2" x2="1"><stop stop-color="#143B5D"/><stop offset="1" stop-color="#246B78"/></linearGradient>
    <filter id="shadow2"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#17324D" flood-opacity=".14"/></filter>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2E6473"/></marker>
    <style>.title{font-family:Arial,sans-serif;font-weight:700}.body{font-family:Arial,sans-serif}.label{font-family:Arial,sans-serif;font-size:21px;font-weight:700;fill:#263746}.detail{font-family:Arial,sans-serif;font-size:17px;fill:#526673}</style>
  </defs>
  <rect width="1600" height="880" fill="#F4F7F9"/>
  <rect width="1600" height="116" fill="url(#header2)"/>
  <text x="800" y="55" text-anchor="middle" class="title" font-size="36" fill="#FFF">Emotion Emerges From a Distributed, Reciprocal Circuit</text>
  <text x="800" y="89" text-anchor="middle" class="body" font-size="19" fill="#DDECF0">No single node or sensor is an emotion detector: interpretation depends on the coordinated pattern, task, and measurement limits</text>

  <rect x="60" y="150" width="1480" height="640" rx="25" fill="#FFF" filter="url(#shadow2)"/>
  <!-- event -->
  <rect x="105" y="337" width="190" height="126" rx="20" fill="#E8F0F9" stroke="#3D79B8" stroke-width="3"/>
  <circle cx="158" cy="383" r="25" fill="#FFF" stroke="#3D79B8" stroke-width="3"/><path d="M145 391L156 373L171 396" fill="none" stroke="#3D79B8" stroke-width="4"/><circle cx="172" cy="374" r="6" fill="#E2A647"/>
  <text x="213" y="373" class="label">Salient event</text><text x="213" y="400" class="detail">face · scene · sound</text><text x="213" y="425" class="detail">social context</text>

  <!-- systems -->
  <g filter="url(#shadow2)">
    <rect x="390" y="190" width="255" height="136" rx="22" fill="#E8F0F9"/><rect x="745" y="190" width="255" height="136" rx="22" fill="#FBEAEA"/><rect x="1100" y="190" width="255" height="136" rx="22" fill="#E4F4EE"/>
    <rect x="390" y="492" width="255" height="136" rx="22" fill="#FBF1DF"/><rect x="745" y="492" width="255" height="136" rx="22" fill="#F0E9F7"/><rect x="1100" y="492" width="255" height="136" rx="22" fill="#E7F0F3"/>
  </g>
  <g text-anchor="middle">
    <text x="517" y="236" class="label">Sensory systems</text><text x="517" y="267" class="detail">visual · auditory</text><text x="517" y="291" class="detail">feature extraction</text>
    <text x="872" y="236" class="label">Salience system</text><text x="872" y="267" class="detail">anterior insula · ACC</text><text x="872" y="291" class="detail">relevance and uncertainty</text>
    <text x="1227" y="236" class="label">Control system</text><text x="1227" y="267" class="detail">lateral PFC · parietal cortex</text><text x="1227" y="291" class="detail">goals · reappraisal</text>
    <text x="517" y="538" class="label">Valuation and memory</text><text x="517" y="569" class="detail">amygdala · hippocampus</text><text x="517" y="593" class="detail">meaning · learned relevance</text>
    <text x="872" y="538" class="label">Bodily regulation</text><text x="872" y="569" class="detail">hypothalamus · brainstem</text><text x="872" y="593" class="detail">autonomic and endocrine state</text>
    <text x="1227" y="538" class="label">Subjective report</text><text x="1227" y="569" class="detail">felt state · appraisal</text><text x="1227" y="593" class="detail">contextual interpretation</text>
  </g>

  <!-- Reciprocal flows -->
  <g fill="none" stroke="#2E6473" stroke-width="4" marker-end="url(#arrow2)">
    <path d="M295 400 C330 400 350 270 380 270"/>
    <path d="M645 265 C682 265 700 265 735 265"/><path d="M1000 265 C1037 265 1057 265 1090 265"/>
    <path d="M1227 326 C1227 390 1040 420 995 492"/><path d="M745 560 C700 560 688 560 655 560"/>
    <path d="M645 560 C696 560 700 367 745 318"/><path d="M1000 560 C1040 560 1059 560 1090 560"/>
  </g>
  <g fill="none" stroke="#718A97" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow2)">
    <path d="M1100 305 C1055 345 1025 356 980 340"/><path d="M745 520 C700 464 652 425 610 320"/><path d="M1110 492 C1060 430 1038 395 1010 335"/>
  </g>
  <text x="787" y="405" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#2E6473">reciprocal influence</text>
  <text x="787" y="430" text-anchor="middle" class="body" font-size="16" fill="#718A97">dashed arrows: feedback and context-dependent modulation</text>

  <!-- measurement band -->
  <rect x="105" y="695" width="1430" height="70" rx="18" fill="#EDF4F6"/>
  <g>
    <rect x="138" y="712" width="278" height="37" rx="18" fill="#C9DDF1"/><text x="277" y="737" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#356A9E">EEG: cortical population dynamics</text>
    <path d="M440 731 H556" stroke="#2E6473" stroke-width="3" marker-end="url(#arrow2)"/>
    <rect x="580" y="712" width="330" height="37" rx="18" fill="#F5D5A7"/><text x="745" y="737" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#9A6A21">Peripheral signals: heart, skin, respiration</text>
    <path d="M934 731 H1050" stroke="#2E6473" stroke-width="3" marker-end="url(#arrow2)"/>
    <rect x="1075" y="712" width="410" height="37" rx="18" fill="#E7C4CB"/><text x="1280" y="737" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#A43B68">Self-report / behavior: felt experience and context</text>
  </g>
  <text x="800" y="830" text-anchor="middle" class="body" font-size="20" font-weight="700" fill="#315361">Interpret a pattern across evidence sources, not as a one-to-one neural signature of an emotion label.</text>
</svg>