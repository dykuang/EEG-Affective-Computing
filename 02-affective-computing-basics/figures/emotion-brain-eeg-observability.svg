<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Emotion-related brain systems and what scalp EEG can observe</title>
  <desc id="desc">A lateral brain illustration distinguishes accessible cortical regions from deep structures observed indirectly, alongside a scalp electrode map highlighting frontal and temporal coverage.</desc>
  <defs>
    <linearGradient id="header" x2="1"><stop stop-color="#143B5D"/><stop offset="1" stop-color="#246B78"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#17324D" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2E6473"/></marker>
    <style>
      .title{font-family:Arial,sans-serif;font-weight:700}.body{font-family:Arial,sans-serif}.small{font-family:Arial,sans-serif;font-size:18px;fill:#526673}.label{font-family:Arial,sans-serif;font-size:19px;font-weight:700;fill:#263746}.note{font-family:Arial,sans-serif;font-size:17px;fill:#526673}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F4F7F9"/>
  <rect width="1600" height="116" fill="url(#header)"/>
  <text x="800" y="55" text-anchor="middle" class="title" font-size="36" fill="#FFF">Emotion-Related Brain Systems and Scalp EEG</text>
  <text x="800" y="89" text-anchor="middle" class="body" font-size="19" fill="#DDECF0">Scalp sensors capture distributed cortical fields; deep structures are inferred only through their interactions with cortex</text>

  <rect x="65" y="150" width="1000" height="675" rx="24" fill="#FFF" filter="url(#shadow)"/>
  <rect x="1100" y="150" width="435" height="675" rx="24" fill="#FFF" filter="url(#shadow)"/>
  <text x="105" y="197" class="title" font-size="25" fill="#263746">Lateral view: cortical access and deep contributors</text>
  <text x="1135" y="197" class="title" font-size="25" fill="#263746">Representative scalp coverage</text>

  <!-- brain silhouette -->
  <path d="M195 485 C180 392 215 300 305 254 C390 210 500 202 600 228 C710 255 823 315 890 401 C948 476 941 563 886 628 C834 690 755 720 662 718 L420 715 C350 714 296 679 272 625 C245 566 249 526 195 485Z" fill="#E8F0F3" stroke="#426273" stroke-width="5"/>
  <path d="M237 488 C279 478 297 507 312 539 C336 589 356 624 408 649" fill="none" stroke="#9FB1BC" stroke-width="4"/>
  <path d="M314 300 C359 335 383 374 378 430 M425 253 C453 306 462 357 449 395 M556 237 C563 284 552 334 533 374 M684 268 C663 327 675 371 709 409 M802 335 C760 375 743 423 754 466 M875 419 C820 462 810 516 836 556" fill="none" stroke="#B6C5CD" stroke-width="4"/>
  <path d="M393 650 C467 649 540 675 630 673" fill="none" stroke="#B6C5CD" stroke-width="4"/>

  <!-- cortical territories -->
  <path d="M224 401 C225 330 278 276 355 254 C411 238 473 239 516 251 L501 404 C455 444 395 454 337 449 C282 445 248 430 224 401Z" fill="#BFE0D5" stroke="#2C9A78" stroke-width="3"/>
  <path d="M503 252 C598 232 700 270 775 329 C809 356 838 393 848 431 L708 474 C648 441 585 421 500 403Z" fill="#C9DDF1" stroke="#3D79B8" stroke-width="3"/>
  <path d="M510 407 C583 425 660 447 718 482 L706 610 C639 650 547 660 463 643 C411 632 376 604 358 560 C402 503 445 451 510 407Z" fill="#F5D5A7" stroke="#D48B2B" stroke-width="3"/>
  <path d="M722 478 L868 436 C902 481 900 546 861 592 C827 631 779 654 709 663Z" fill="#E7C4CB" stroke="#B85A68" stroke-width="3"/>

  <text x="305" y="337" class="label">Prefrontal cortex</text><text x="305" y="362" class="note">appraisal · regulation</text>
  <text x="635" y="332" class="label">Parietal cortex</text><text x="635" y="357" class="note">attention · integration</text>
  <text x="455" y="548" class="label">Temporal cortex</text><text x="455" y="573" class="note">auditory / social cues</text>
  <text x="752" y="550" class="label">Occipital cortex</text><text x="752" y="575" class="note">visual input</text>

  <!-- deep nodes -->
  <ellipse cx="550" cy="498" rx="34" ry="26" fill="#D95757" stroke="#A43B3B" stroke-width="3"/>
  <ellipse cx="606" cy="520" rx="41" ry="28" fill="#E2A647" stroke="#9A6A21" stroke-width="3"/>
  <ellipse cx="636" cy="559" rx="23" ry="36" fill="#8C71A8" stroke="#664B82" stroke-width="3"/>
  <circle cx="500" cy="453" r="28" fill="#D56E98" stroke="#A43B68" stroke-width="3"/>
  <text x="493" y="459" text-anchor="middle" class="body" font-size="15" font-weight="700" fill="#FFF">ACC</text>
  <path d="M530 482 L455 435" stroke="#A43B3B" stroke-width="2.5"/><text x="338" y="429" class="label">Anterior cingulate</text><text x="338" y="453" class="note">control · salience</text>
  <path d="M555 498 L760 370" stroke="#A43B3B" stroke-width="2.5"/><text x="770" y="349" class="label">Amygdala</text><text x="770" y="374" class="note">salience · learning</text>
  <path d="M609 518 L805 470" stroke="#9A6A21" stroke-width="2.5"/><text x="815" y="458" class="label">Insula</text><text x="815" y="483" class="note">interoception</text>
  <path d="M638 558 L795 620" stroke="#664B82" stroke-width="2.5"/><text x="805" y="617" class="label">Hypothalamus / brainstem</text><text x="805" y="642" class="note">autonomic and endocrine control</text>

  <!-- observability key -->
  <rect x="128" y="750" width="890" height="50" rx="15" fill="#EDF4F6"/>
  <rect x="154" y="765" width="22" height="22" rx="5" fill="#BFE0D5"/><text x="186" y="783" class="body" font-size="18" fill="#315361">Cortical regions contribute more directly to scalp EEG</text>
  <rect x="580" y="765" width="22" height="22" rx="5" fill="#D95757"/><text x="612" y="783" class="body" font-size="18" fill="#315361">Deep systems are observed indirectly through cortical consequences</text>

  <!-- scalp head -->
  <circle cx="1318" cy="395" r="150" fill="#E8F0F3" stroke="#426273" stroke-width="5"/>
  <path d="M1318 235 L1288 281 L1348 281 Z" fill="#426273"/>
  <path d="M1169 396 C1144 376 1144 414 1169 394 M1467 396 C1492 376 1492 414 1467 394" fill="none" stroke="#426273" stroke-width="5"/>
  <g fill="#FFF" stroke="#5C7380" stroke-width="3">
    <circle cx="1262" cy="315" r="15"/><circle cx="1374" cy="315" r="15"/><circle cx="1268" cy="385" r="15"/><circle cx="1368" cy="385" r="15"/><circle cx="1318" cy="390" r="15"/><circle cx="1247" cy="468" r="15"/><circle cx="1389" cy="468" r="15"/><circle cx="1318" cy="485" r="15"/><circle cx="1268" cy="547" r="15"/><circle cx="1368" cy="547" r="15"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#426273" text-anchor="middle">
    <text x="1262" y="321">F3</text><text x="1374" y="321">F4</text><text x="1268" y="391">C3</text><text x="1368" y="391">C4</text><text x="1318" y="396">Fz</text><text x="1247" y="474">T7</text><text x="1389" y="474">T8</text><text x="1318" y="491">Cz</text><text x="1268" y="553">P3</text><text x="1368" y="553">P4</text>
  </g>
  <g fill="none" stroke-width="4" stroke-dasharray="8 7">
    <ellipse cx="1318" cy="315" rx="82" ry="42" stroke="#2C9A78"/><ellipse cx="1318" cy="468" rx="104" ry="35" stroke="#D48B2B"/>
  </g>
  <text x="1318" y="628" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#26785E">Frontal pairs: asymmetry studies</text>
  <text x="1318" y="657" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#9A6A21">Temporal coverage: sensory / social processing</text>
  <rect x="1145" y="700" width="345" height="74" rx="15" fill="#FBF1DF" stroke="#E2A647" stroke-width="2"/>
  <text x="1318" y="730" text-anchor="middle" class="body" font-size="18" font-weight="700" fill="#806439">Sensor location is not source identity</text>
  <text x="1318" y="755" text-anchor="middle" class="body" font-size="16" fill="#806439">volume conduction and reference choice matter</text>
</svg>